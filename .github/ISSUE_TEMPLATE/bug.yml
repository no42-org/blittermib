name: Bug report
description: Something behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not** use this form for
        security vulnerabilities — see [SECURITY.md](https://github.com/no42-org/blittermib/blob/main/SECURITY.md).

        Adding or correcting a MIB in the bundled corpus is a different
        workflow — see [mibs/CONTRIBUTING.md](https://github.com/no42-org/blittermib/blob/main/mibs/CONTRIBUTING.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        The smallest sequence that triggers it. If a specific MIB module
        is involved, name it — behaviour is often module-specific.
      placeholder: |
        1. docker run --rm -p 8080:8080 -v ./mibs:/mibs ghcr.io/no42-org/blittermib:0.17.7
        2. Open /m/IF-MIB
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `blittermib -version` (or the image tag you pulled).
      placeholder: v0.17.7
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - Docker / Compose
        - Release binary
        - Kubernetes (Helm)
        - Built from source
        - MCP server (blittermib-mcp)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste the actual output rather than a paraphrase. This is rendered as a code block automatically.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues (including closed ones) for this problem.
          required: true
        - label: I am on the latest release, or have checked the problem still exists there.
          required: false
