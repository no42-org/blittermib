version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - go

  # Base images in the Dockerfile — the one dependency surface that was
  # otherwise updated only by hand.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - docker

  # The ClusterFuzzLite build image is pinned by digest, so it needs its
  # own entry — without one the pin would freeze at whatever base-builder-go
  # shipped the day it was written.
  - package-ecosystem: docker
    directory: "/.clusterfuzzlite"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - docker
