# CodeQL configuration.
#
# `paths-ignore` keeps generated code out of analysis. The templ
# compiler emits *_templ.go from the .templ sources, and its output
# trips the quality queries (dozens of go/useless-assignment-to-local
# on the generated render scaffolding) — noise nobody can act on, since
# editing generated files is pointless and they're regenerated by
# `make generate`. golangci-lint already excludes the same pattern
# (.golangci.yml). The hand-written code is still fully analyzed.
name: blittermib CodeQL config

paths-ignore:
  - '**/*_templ.go'
