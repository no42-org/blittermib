# zizmor configuration — see https://docs.zizmor.sh/configuration/
#
# Every entry here is a deliberate exception with a stated reason. If a
# finding can be fixed instead of ignored, fix it.

rules:
  artipacked:
    ignore:
      # refresh-pen.yml is the one workflow that genuinely pushes with
      # the checkout token: it commits the refreshed IANA PEN snapshot
      # to a branch and opens a PR. `persist-credentials: false` would
      # break it. The job runs only on a schedule/dispatch, is fenced to
      # this repository, and never checks out untrusted code.
      - refresh-pen.yml

  superfluous-actions:
    ignore:
      # softprops/action-gh-release is kept over a `gh release` script
      # step for `generate_release_notes` plus `fail_on_unmatched_files`
      # — reimplementing both in shell would be more code and more
      # failure modes than the action it replaces.
      - release.yml

  self-repository:
    ignore:
      # zizmor 1.30 wants GitHub's July-2026 `uses: $/...` self-repository
      # syntax, but no actionlint release supports it yet: the newest,
      # v1.7.12 (Mar 2026), rejects `$/` under its workflow-call rule.
      # Migrating would trade a red zizmor gate for a red actionlint
      # gate. Keep `./` until actionlint adds `$/` support, then drop
      # this block and migrate all three.
      - ci.yml
      - preview.yml
      - release.yml
