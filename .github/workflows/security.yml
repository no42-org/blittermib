name: Security

# Scanning that complements the Go-native tools already in the gates
# (govulncheck, gosec, zizmor): CodeQL's dataflow analysis, a
# dependency-license/vulnerability review on incoming PRs, and the
# OpenSSF Scorecard as an external grader of this repo's supply-chain
# posture.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:17 UTC. Off the hour so we're not queued behind every
    # other repo's `0 5 * * *`.
    - cron: '17 5 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          languages: go
          # security-extended, NOT security-and-quality: the `-quality`
          # suite adds maintainability queries whose only findings here
          # were 64 go/useless-assignment-to-local on generated templ
          # scaffolding. Quality is already covered by golangci-lint +
          # gosec + govulncheck; CodeQL's job is the security dataflow
          # queries (injection, SSRF, …), all of which security-extended
          # keeps. (paths-ignore can't drop them either — it is ignored
          # for compiled languages, so every file in the Go build is
          # analysed regardless of path.)
          queries: security-extended

      # templ output is generated, not committed in a compilable state
      # for a fresh clone — CodeQL's autobuild would fail without it.
      - name: Generate (templ)
        run: make generate

      - name: Build
        run: make build

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          category: /language:go

  dependency-review:
    name: Dependency review
    # Only meaningful on a PR — it diffs the manifest against the base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # The project ships under MIT; a copyleft transitive dep would
          # be a licensing problem worth catching at review time.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  scorecard:
    name: OpenSSF Scorecard
    # The scheduled run is what populates the security tab; PR runs
    # would grade the fork, not this repo.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Publishes the result to the OpenSSF REST API for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          sarif_file: results.sarif
