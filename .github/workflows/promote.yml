name: Promote release image

# Publishing a GitHub Release is the human approval gate for the
# container image.
#
# release.yml builds, signs, and attests the image at tag time but only
# tags it `staging`. This workflow attaches the user-facing tags
# once the release is actually published — so a tag push can no longer
# move `latest` for every user before anyone has looked at the release.
#
# Promotion re-tags an EXISTING digest (`docker buildx imagetools
# create`); it does not rebuild. The image bytes users pull are
# byte-identical to the ones that were signed and attested, and the
# digest signature covers every tag pointing at it — nothing is
# re-signed here.

on:
  release:
    types: [published]

# Never cancel: a half-promoted image is a broken `latest`.
concurrency:
  group: promote-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ github.event.release.tag_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Attach release tags to the staged digest
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          image="ghcr.io/${OWNER}/blittermib"
          version="${TAG#v}"
          staging="${image}:staging"

          # A release published for a tag that never ran release.yml
          # (hand-created, or a failed build) has nothing to promote —
          # fail loudly rather than silently leaving `latest` stale.
          if ! digest="$(docker buildx imagetools inspect "$staging" \
                          --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "::error::No staged image at ${staging}. Nothing to promote — check that release.yml's docker job succeeded for ${TAG}."
            exit 1
          fi
          echo "staged digest: ${digest}"

          # `staging` is mutable, so it is not proof of anything on its
          # own: tagging a second release before publishing the first
          # leaves it pointing at the newer build. The image carries the
          # git tag it was built for as an OCI label — check it, and
          # refuse rather than promote the wrong bytes to `latest`.
          # Multi-arch, so the label is read per-platform; all platforms
          # come from one build and must agree.
          staged_version="$(docker buildx imagetools inspect "${image}@${digest}" \
            --format '{{json .Image}}' \
            | jq -r '[.[].config.Labels["org.opencontainers.image.version"]] | unique | if length == 1 then .[0] else "MISMATCHED-ACROSS-PLATFORMS" end')"

          if [ "$staged_version" != "$TAG" ]; then
            echo "::error::Staged image is for '${staged_version}', but '${TAG}' is being published. The staging tag was overwritten by a later release — re-run release.yml for ${TAG} before publishing it."
            exit 1
          fi
          echo "staged image confirmed as ${TAG}"

          tags=(--tag "${image}:${version}")
          if [ "$PRERELEASE" = "false" ]; then
            # Floating tags follow stable releases only.
            tags+=(--tag "${image}:${version%.*}" --tag "${image}:latest")
          else
            echo "prerelease — publishing ${version} only, leaving latest/X.Y untouched"
          fi

          docker buildx imagetools create "${tags[@]}" "${image}@${digest}"

          {
            echo "### Image promoted"
            echo
            echo "Digest \`${digest}\` now also carries:"
            for t in "${tags[@]}"; do
              [ "$t" = "--tag" ] && continue
              echo "- \`${t}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Verify the promoted tag still verifies
        # Promotion only adds tags, so the release-time signature must
        # still check out. If it doesn't, something re-pushed the tag
        # between build and promotion and users must not pull it.
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cosign verify "ghcr.io/${OWNER}/blittermib:${version}" \
            --certificate-identity-regexp='^https://github.com/no42-org/blittermib/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
