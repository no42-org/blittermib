name: Preview

# Every green push to `main` publishes a preview image so the tip of
# main is installable without cutting a release.
#
# The single `rc` tag is OVERWRITTEN on each build — that overwrite is
# the registry-space control, which is why there are no per-commit tags
# and no cleanup job. Do NOT add a blanket untagged-version prune here:
# a multi-arch image is a tagged manifest list plus untagged per-arch
# children, so pruning untagged versions would break already-published
# releases.
#
# `rc` never touches `latest`, `X.Y`, or `X.Y.Z` — those belong to
# release.yml and only ever point at a released version.

on:
  push:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Preview builds clear the same bar as everything else — an `rc` image
  # that doesn't pass the gates is worse than no `rc` image.
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  image:
    name: Publish rc image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: gates
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # `git describe` for the preview version string
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # Something like `v0.17.7-12-gfdca5b1`, so `blittermib -version`
      # on a preview image is obviously not a release and names the
      # commit it came from.
      - name: Compute preview version
        id: v
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch rc image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/blittermib:rc
          build-args: |
            VERSION=${{ steps.v.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/blittermib
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
