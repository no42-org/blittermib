name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on a branch — no point keeping stale checks
# alive across a rebase or a fixup-push pile-up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gates live in one reusable workflow shared with release.yml, so
  # a release can never publish through a weaker bar than a PR clears.
  gates:
    name: gates
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read
