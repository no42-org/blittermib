name: ClusterFuzzLite batch

# Scheduled batch fuzzing of HEAD. Unlike the PR job (which fuzzes only
# what a diff touches, from a cold start), this fuzzes every target for
# longer and PERSISTS the accumulated corpus to the same-repo
# `clusterfuzzlite` storage branch. The PR job and the next batch run
# read that corpus, so coverage compounds over time instead of
# restarting each run — the whole reason to add ClusterFuzzLite on top
# of native `go test -fuzz`.
#
# Storage model: same repo, orphan branches (`clusterfuzzlite` corpus,
# `gh-pages` coverage), pushed with GITHUB_TOKEN — no PAT, no separate
# repo. Non-blocking by nature (scheduled); a crash fails the run and
# uploads the reproducer.

on:
  schedule:
    # Daily 03:17 UTC. Off the hour to dodge the scheduler peak.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Total fuzzing budget across targets (seconds)
        required: false
        default: '1800'

permissions:
  contents: read

concurrency:
  group: cflite-batch
  cancel-in-progress: false

jobs:
  batch:
    # Don't run the scheduled sweep in forks.
    if: github.repository == 'no42-org/blittermib' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Push the accumulated corpus to the same-repo `clusterfuzzlite`
      # storage branch.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: go

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event.inputs.fuzz-seconds || '1800' }}
          mode: batch
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/no42-org/blittermib.git
          storage-repo-branch: clusterfuzzlite
          storage-repo-branch-coverage: gh-pages
